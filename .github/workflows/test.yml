name: 自动化测试

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # 每天凌晨 2 点运行
    - cron: '0 2 * * *'

jobs:
  test:
    name: 测试 Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-timeout hypothesis
    
    - name: 语法检查
      run: |
        python -m py_compile cli_encrypt.py
        python -m py_compile crypto_core.py
        python -m py_compile biometric_auth.py
        python -m py_compile steganography.py
    
    - name: 运行单元测试
      run: |
        python -m pytest test_full.py -v --tb=short --timeout=60
      continue-on-error: false
    
    - name: 运行边界测试
      run: |
        python -m pytest test_boundary.py -v --tb=short --timeout=120
      continue-on-error: true
    
    - name: 运行 E2E 测试
      run: |
        python test_e2e.py
      continue-on-error: true
    
    - name: 生成覆盖率报告
      run: |
        python -m pytest test_full.py test_boundary.py \
          --cov=crypto_core \
          --cov=cli_encrypt \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term
      continue-on-error: true
    
    - name: 上传覆盖率报告
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
      continue-on-error: true
    
    - name: 上传测试报告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          htmlcov/
          test_report_*.json
        retention-days: 30

  performance:
    name: 性能测试
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 性能测试
      run: |
        # 创建测试文件
        dd if=/dev/urandom of=test_10mb.bin bs=1M count=10
        
        # 测试加密性能
        time python cli_encrypt.py encrypt test_10mb.bin -o test_10mb.enc -p "TestPass123!"
        
        # 测试解密性能
        time python cli_encrypt.py decrypt test_10mb.enc -o test_10mb.dec -p "TestPass123!"
        
        # 验证文件完整性
        diff test_10mb.bin test_10mb.dec
        
        echo "性能测试完成"

  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 安装安全扫描工具
      run: |
        pip install bandit safety
    
    - name: 运行 Bandit 安全扫描
      run: |
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -f txt
      continue-on-error: true
    
    - name: 检查依赖安全性
      run: |
        safety check --json || true
        safety check
      continue-on-error: true
    
    - name: 上传安全报告
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
        retention-days: 30

  build:
    name: 构建可执行文件
    runs-on: ${{ matrix.os }}
    needs: test
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v3
    
    - name: 设置 Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 构建可执行文件
      run: |
        python -m PyInstaller --onefile \
          --name cli-encrypt-${{ matrix.os }} \
          --hidden-import=crypto_core \
          --hidden-import=steganography \
          --hidden-import=biometric_auth \
          cli_encrypt.py
    
    - name: 测试可执行文件
      run: |
        ./dist/cli-encrypt-${{ matrix.os }} --help
      shell: bash
    
    - name: 上传构建产物
      uses: actions/upload-artifact@v3
      with:
        name: executable-${{ matrix.os }}
        path: dist/
        retention-days: 90

  notify:
    name: 通知
    runs-on: ubuntu-latest
    needs: [test, performance, security, build]
    if: always()
    
    steps:
    - name: 发送通知
      run: |
        echo "测试完成！"
        echo "测试状态: ${{ needs.test.result }}"
        echo "性能测试: ${{ needs.performance.result }}"
        echo "安全扫描: ${{ needs.security.result }}"
        echo "构建状态: ${{ needs.build.result }}"
